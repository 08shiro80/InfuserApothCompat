plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.80'
}

version = '1.3.5'
group = 'com.digitalfeonix.infuserapothcompat'

base {
    archivesName = 'infuserapothcompat'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(javaVersion as int)

neoForge {
    version = forgeVersion

    parchment {
        mappingsVersion = parchmentVersion
        minecraftVersion = mcVersion
    }

    runs {
        client {
            client()
        }
        server {
            server()
        }
    }

    mods {
        infuserapothcompat {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    mavenLocal()
    maven {
        name = 'ParchmentMC'
        url = 'https://maven.parchmentmc.org'
    }
    maven {
        name = 'Shadows Maven'
        url = 'https://maven.shadowsoffire.dev/releases'
    }
    maven {
        name = 'CurseMaven'
        url = 'https://cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com'
    }
    mavenCentral()
}

dependencies {
    implementation "dev.shadowsoffire:ApothicEnchanting:${mcVersion}-${apothicEnchantingVersion}"
    implementation "dev.shadowsoffire:Placebo:${mcVersion}-${placeboVersion}"

    compileOnly "curse.maven:enchanting-infuser-551151:7354838"

    compileOnly "snownee.jade:Jade-NeoForge:${mcVersion}-${jadeVersion}"

    if (project.hasProperty('mixinVersion')) {
        annotationProcessor "org.spongepowered:mixin:${mixinVersion}:processor"
    }
}

jar {
    exclude 'dev/shadowsoffire/**'
    exclude 'fuzs/**'
    exclude 'snownee/**'

    manifest {
        attributes([
            "Specification-Title"     : "infuserapothcompat",
            "Specification-Vendor"    : "DigitalFeonix",
            "Specification-Version"   : "1",
            "Implementation-Title"    : project.name,
            "Implementation-Version"  : project.jar.archiveVersion,
            "Implementation-Vendor"   : "DigitalFeonix",
            "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
            "MixinConfigs"            : "infuserapothcompat.mixins.json"
        ])
    }
}
