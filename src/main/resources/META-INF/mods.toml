[[mods]]
modId="infuserapothcompat"
version="1.0.0"
displayName="Infuser Apotheosis Compat"
authors="DigitalFeonix"
description='''
Enhanced compatibility between Enchanting Infuser and Apotheosis.

This mod improves the integration so that Apotheosis bookshelves and infusion recipes
work properly with the Enchanting Infuser.

Features:
- Apotheosis bookshelves provide their full Eterna bonus
- Max Eterna scaling from special bookshelves
- Higher enchantment levels from Apotheosis config
- Proper treasure/discoverable enchantment handling
- Apotheosis Infusion Recipes (Hellshelf, Deepshelf, etc.) work in the Infuser
'''

[[mixins]]
config="infuserapothcompat.mixins.json"

[[dependencies.infuserapothcompat]]
modId="forge"
mandatory=true
versionRange="[47,)"
ordering="NONE"
side="BOTH"

[[dependencies.infuserapothcompat]]
modId="minecraft"
mandatory=true
versionRange="[1.20.1,1.21)"
ordering="NONE"
side="BOTH"

[[dependencies.infuserapothcompat]]
modId="apotheosis"
mandatory=true
versionRange="[7.0.0,)"
ordering="AFTER"
side="BOTH"

[[dependencies.infuserapothcompat]]
