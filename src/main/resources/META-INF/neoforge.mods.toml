type = "required"
versionRange = "[1.21.1,1.22)"
ordering = "NONE"
side = "BOTH"

[[dependencies.infuserapothcompat]]
modId = "apothic_enchanting"
type = "required"
versionRange = "[1.5.0,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.infuserapothcompat]]
modId = "enchantinginfuser"
type = "required"
versionRange = "*"
ordering = "AFTER"
side = "BOTH"

[[dependencies.infuserapothcompat]]
